<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CS180 computer vision project portfolio">
    <title>CS180 Portfolio</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18201c;
            --muted: #657069;
            --paper: #f4f2eb;
            --card: #fffdf7;
            --accent: #386751;
            --line: #d8d7cf;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 10%, rgba(87, 133, 111, 0.14), transparent 30rem),
                var(--paper);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(960px, calc(100% - 40px));
            margin: 0 auto;
            padding: 12vh 0 80px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.8rem, 8vw, 5.8rem);
            font-weight: 500;
            letter-spacing: -0.045em;
            line-height: 0.98;
        }

        .intro {
            max-width: 560px;
            margin: 28px 0 54px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .project-card {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 24px;
            align-items: center;
            padding: 28px 30px;
            color: inherit;
            background: rgba(255, 253, 247, 0.9);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(28, 39, 33, 0.07);
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .project-card:hover,
        .project-card:focus-visible {
            border-color: #9eb2a8;
            box-shadow: 0 18px 45px rgba(28, 39, 33, 0.12);
            outline: none;
            transform: translateY(-3px);
        }

        .project-number {
            display: grid;
            width: 62px;
            height: 62px;
            place-items: center;
            color: var(--card);
            background: var(--accent);
            border-radius: 50%;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.5rem;
        }

        .project-label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .project-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.35rem, 4vw, 1.8rem);
        }

        .arrow {
            color: var(--accent);
            font-size: 1.75rem;
            transition: transform 180ms ease;
        }

        .project-card:hover .arrow {
            transform: translateX(4px);
        }

        @media (max-width: 560px) {
            main {
                width: min(100% - 28px, 960px);
                padding-top: 9vh;
            }

            .project-card {
                grid-template-columns: auto 1fr;
                gap: 16px;
                padding: 22px 20px;
            }

            .project-number {
                width: 50px;
                height: 50px;
            }

            .arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">CS180 · Computer Vision</p>
        <h1>Project Portfolio</h1>
        <p class="intro">A collection of experiments in computational photography and visual perception.</p>

        <a class="project-card" href="./project0/" aria-label="Open Project 0: Becoming Friends with Your Camera">
            <span class="project-number">0</span>
            <span>
                <span class="project-label">Project 0</span>
                <span class="project-title">Becoming Friends with Your Camera</span>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
        </a>
    </main>
</body>
</html>
